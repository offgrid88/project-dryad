name: Build ESP32-C3 LCD Project

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

env:
  ESP_IDF_VERSION: v5.1.2
  ESP_BOARD: esp32c3

jobs:
  build:
    name: Build with ESP-IDF ${{ matrix.idf_version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        idf_version: [v5.1.2, v5.0.4]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache ESP-IDF
      id: cache-idf
      uses: actions/cache@v3
      with:
        path: ~/esp/esp-idf
        key: ${{ runner.os }}-esp-idf-${{ matrix.idf_version }}-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-esp-idf-${{ matrix.idf_version }}-
          ${{ runner.os }}-esp-idf-
    
    - name: Install ESP-IDF
      if: steps.cache-idf.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/esp
        cd ~/esp
        git clone -b ${{ matrix.idf_version }} --recursive https://github.com/espressif/esp-idf.git
        cd ~/esp/esp-idf
        ./install.sh esp32c3
    
    - name: Build Project
      run: |
        . ~/esp/esp-idf/export.sh
        idf.py set-target esp32c3
        idf.py build
    
    - name: Check Build Size
      run: |
        . ~/esp/esp-idf/export.sh
        idf.py size
        idf.py size-components
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: esp32c3-lcd-build-${{ matrix.idf_version }}
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
          build/*.elf
          build/*.map
          build/flash_args
        retention-days: 7
    
    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: build-logs-${{ matrix.idf_version }}
        path: |
          build/log/*
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
        retention-days: 3

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache ESP-IDF
      id: cache-idf-quality
      uses: actions/cache@v3
      with:
        path: ~/esp/esp-idf
        key: ${{ runner.os }}-esp-idf-${{ env.ESP_IDF_VERSION }}-quality
        restore-keys: |
          ${{ runner.os }}-esp-idf-${{ env.ESP_IDF_VERSION }}-
    
    - name: Install ESP-IDF
      if: steps.cache-idf-quality.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/esp
        cd ~/esp
        git clone -b ${{ env.ESP_IDF_VERSION }} --recursive https://github.com/espressif/esp-idf.git
        cd ~/esp/esp-idf
        ./install.sh esp32c3
    
    - name: Run Static Analysis
      run: |
        . ~/esp/esp-idf/export.sh
        idf.py set-target esp32c3
        # Check for common issues
        find main components -name "*.c" -o -name "*.h" | xargs -I {} sh -c 'echo "Checking {}" && gcc -fsyntax-only -Wall -Wextra -I ~/esp/esp-idf/components/freertos/FreeRTOS-Kernel/include -I ~/esp/esp-idf/components/esp_common/include {} 2>&1 | grep -v "No such file" || true'
    
    - name: Check Code Formatting
      continue-on-error: true
      run: |
        # Install clang-format
        sudo apt-get update && sudo apt-get install -y clang-format
        # Check formatting (informational only)
        find main components -name "*.c" -o -name "*.h" | xargs clang-format --dry-run -Werror 2>&1 || echo "::warning::Code formatting issues found. Consider running clang-format."

  create-release:
    name: Create Release Package
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: esp32c3-lcd-build-v5.1.2
        path: release/
    
    - name: Create Release Package
      run: |
        cd release
        # Create flash command script
        cat > flash.sh << 'EOF'
        #!/bin/bash
        PORT=${1:-/dev/ttyUSB0}
        echo "Flashing to port: $PORT"
        esptool.py -p $PORT -b 460800 --before default_reset --after hard_reset --chip esp32c3 \
          write_flash --flash_mode dio --flash_size 4MB --flash_freq 80m \
          0x0 bootloader.bin \
          0x8000 partition-table.bin \
          0x10000 esp32_lcd_project.bin
        EOF
        chmod +x flash.sh
        
        # Create README for release
        cat > README_FLASH.md << 'EOF'
        # ESP32-C3 LCD Project - Flash Instructions
        
        ## Requirements
        - esptool.py (install with: pip install esptool)
        - USB cable connected to ESP32-C3
        
        ## Flashing
        
        ### Linux/Mac:
        ```bash
        chmod +x flash.sh
        ./flash.sh /dev/ttyUSB0  # Replace with your port
        ```
        
        ### Windows:
        ```cmd
        esptool.py -p COM3 -b 460800 --before default_reset --after hard_reset --chip esp32c3 write_flash --flash_mode dio --flash_size 4MB --flash_freq 80m 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 esp32_lcd_project.bin
        ```
        
        ## Finding Your Port
        - Linux: Usually /dev/ttyUSB0 or /dev/ttyACM0
        - Mac: /dev/cu.usbserial-* or /dev/cu.SLAB_USBtoUART
        - Windows: COM3, COM4, etc. (check Device Manager)
        EOF
        
        # Create archive
        zip -r esp32c3-lcd-firmware.zip *.bin *.elf flash.sh README_FLASH.md flash_args
    
    - name: Upload Release Package
      uses: actions/upload-artifact@v3
      with:
        name: esp32c3-lcd-firmware-release
        path: release/esp32c3-lcd-firmware.zip
        retention-days: 30
    
    - name: Comment PR with Build Info
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          // Read flash_args to get binary sizes
          let sizeInfo = 'Build completed successfully! 🎉\n\n';
          sizeInfo += '### Binary Sizes\n';
          sizeInfo += '| File | Size |\n';
          sizeInfo += '|------|------|\n';
          
          const files = ['bootloader.bin', 'partition-table.bin', 'esp32_lcd_project.bin'];
          for (const file of files) {
            try {
              const stats = fs.statSync(`release/${file}`);
              const size = (stats.size / 1024).toFixed(2);
              sizeInfo += `| ${file} | ${size} KB |\n`;
            } catch (e) {
              console.log(`Could not stat ${file}`);
            }
          }
          
          sizeInfo += '\n### Flash Instructions\n';
          sizeInfo += 'Download the firmware package from the artifacts and follow the included instructions.\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: sizeInfo
          });

  notify-status:
    name: Notify Build Status
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check Build Status
      run: |
        if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Build successful!"
          exit 0
        else
          echo "❌ Build or quality checks failed!"
          exit 1
        fi