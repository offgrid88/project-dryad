name: ESP32-C6 Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build ESP32-C6 Firmware
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5
        target: esp32c6
        path: '.'
    
    - name: Build firmware
      run: |
        . $IDF_PATH/export.sh
        idf.py build
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32c6-firmware-${{ github.sha }}
        path: |
          build/dryad.bin
          build/dryad.elf
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          build/flash_args
        retention-days: 30
    
    - name: Generate flash instructions
      run: |
        echo "# ESP32-C6 Firmware Flash Instructions" > flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Option 1: Using esptool.py" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "esptool.py -p PORT -b 460800 --before default_reset --after hard_reset write_flash @flash_args" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Option 2: Using ESP-IDF" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "idf.py -p PORT flash" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "Replace PORT with your serial port (e.g., /dev/ttyUSB0 or COM3)" >> flash_instructions.md
    
    - name: Upload flash instructions
      uses: actions/upload-artifact@v4
      with:
        name: flash-instructions-${{ github.sha }}
        path: flash_instructions.md
        retention-days: 30

    - name: Create Release (on main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Build ${{ github.run_number }}
        draft: false
        prerelease: true
        files: |
          build/dryad.bin
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          flash_instructions.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}