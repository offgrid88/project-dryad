name: Build Firmware

on:
  push:
    branches: [ main, dev, mhamed ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover-envs:
    name: Discover PlatformIO environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.parse.outputs.envs }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse platformio.ini
        id: parse
        run: |
          envs=$(python3 -c "
          import configparser, json
          cfg = configparser.ConfigParser()
          cfg.read('platformio.ini')
          envs = [s[4:] for s in cfg.sections() if s.startswith('env:')]
          print(json.dumps(envs))
          ")
          echo "envs=$envs" >> $GITHUB_OUTPUT
          echo "Found environments: $envs"

  build:
    name: Build [${{ matrix.env }}]
    needs: discover-envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover-envs.outputs.envs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.run_number }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin
            .pio/build/${{ matrix.env }}/*.elf
          retention-days: 30

  build-summary:
    name: All boards passed
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "All board builds succeeded"
          else
            echo "One or more board builds failed"
            exit 1
          fi
