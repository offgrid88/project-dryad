name: Build ESP32-C6 Firmware

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  IDF_VERSION: v5.5
  TARGET: esp32c6

jobs:
  build:
    name: Build ESP32-C6
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Build ESP-IDF Project
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        target: ${{ env.TARGET }}
        path: '.'
    
    - name: Create build info
      run: |
        echo "Build Information" > build_info.txt
        echo "=================" >> build_info.txt
        echo "Date: $(date)" >> build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        echo "Branch: ${{ github.ref_name }}" >> build_info.txt
        echo "ESP-IDF Version: ${{ env.IDF_VERSION }}" >> build_info.txt
        echo "Target: ${{ env.TARGET }}" >> build_info.txt
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32c6-firmware-${{ github.run_number }}
        path: |
          build/dryad.bin
          build/dryad.elf
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          build/flash_args
          build_info.txt
        retention-days: 30
    
    - name: Generate flash instructions
      run: |
        echo "# ESP32-C6 Flash Instructions" > flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Quick Flash (using flash_args)" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "esptool.py -p PORT -b 460800 --before default_reset --after hard_reset write_flash @flash_args" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Manual Flash" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "esptool.py -p PORT -b 460800 --chip esp32c6 \\" >> flash_instructions.md
        echo "  --before default_reset --after hard_reset write_flash \\" >> flash_instructions.md
        echo "  0x0 bootloader.bin \\" >> flash_instructions.md
        echo "  0x8000 partition-table.bin \\" >> flash_instructions.md
        echo "  0x10000 dryad.bin" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Using ESP-IDF" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "idf.py -p PORT flash" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "Replace PORT with your serial port (e.g., /dev/ttyUSB0, /dev/ttyACM0, or COM3)" >> flash_instructions.md
    
    - name: Upload flash instructions
      uses: actions/upload-artifact@v4
      with:
        name: flash-instructions-${{ github.run_number }}
        path: flash_instructions.md
        retention-days: 30
    
    # Create release for main branch pushes
