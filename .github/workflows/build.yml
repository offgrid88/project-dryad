name: Build Dryad Firmware

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - target: esp32c6
            idf_version: "5.2"
          - target: esp32c3
            idf_version: "5.2"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v${{ matrix.idf_version }}
        target: ${{ matrix.target }}
        path: '.'
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.target }}
        path: |
          build/dryad.bin
          build/dryad.elf
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          build/flash_args
        retention-days: 30
    
    - name: Generate flash instructions
      run: |
        echo "# Firmware Flash Instructions for ${{ matrix.target }}" > flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Using esptool.py:" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "esptool.py -p PORT -b 460800 --before default_reset --after hard_reset write_flash @flash_args" >> flash_instructions.md
        echo '```' >> flash_instructions.md
        echo "" >> flash_instructions.md
        echo "## Using ESP-IDF:" >> flash_instructions.md
        echo '```bash' >> flash_instructions.md
        echo "idf.py -p PORT flash" >> flash_instructions.md
        echo '```' >> flash_instructions.md
    
    - name: Upload flash instructions
      uses: actions/upload-artifact@v4
      with:
        name: flash-instructions-${{ matrix.target }}
        path: flash_instructions.md
        retention-days: 30
