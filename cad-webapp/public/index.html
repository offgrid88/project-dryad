<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dryad CAD</title>
<style>
  :root { --bg:#f4f5f2; --panel:#fff; --ink:#1d2a1f; --muted:#667067; --line:#dde1da; --accent:#2e7d32; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a15; --panel:#1c241d; --ink:#e6ece6; --muted:#97a398; --line:#2e3a2f; --accent:#66bb6a; --warn:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); display:grid; grid-template-columns:320px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 2px; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 14px; font-size:12px; }
  details { border-top:1px solid var(--line); padding:8px 0; } summary { cursor:pointer; font-weight:600; }
  label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; color:var(--muted); }
  input[type=number] { width:76px; padding:3px 5px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:4px; }
  .key input[type=number] { width:90px; font-weight:600; }
  button { padding:7px 10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  #warn { color:var(--warn); font-size:12px; } #stats { font-size:12px; color:var(--muted); width:100%; border-collapse:collapse; }
  #stats td { padding:2px 0; } #stats td:not(:first-child) { text-align:right; }
  main { position:relative; } #view { width:100%; height:100%; display:block; }
  #busy { position:absolute; top:12px; right:12px; background:var(--panel); border:1px solid var(--line); padding:4px 10px; border-radius:12px; font-size:12px; display:none; }
  #legend { position:absolute; left:12px; bottom:12px; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; } main { height:70vh; } aside { border-right:0; } }
</style>
</head>
<body>
<aside>
  <h1><span>Dryad</span> CAD</h1>
  <p class="sub">Parametric 3D-print body. Only the collar follows the vase; only the cradle follows the bottle. Units: mm.</p>
  <div class="key">
    <label>Vase outer Ø <input type="number" id="vaseD" step="1"></label>
    <label>Bottle Ø (100 ml) <input type="number" id="bottleD" step="0.5"></label>
  </div>
  <div id="warn"></div>
  <div class="row">
    <button class="primary" id="dlAll">Assembly STL</button>
    <button id="dlPlate">Print plate STL</button>
  </div>
  <div class="row" id="partBtns"></div>
  <div class="row">
    <label style="width:100%">Exploded view <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
    <label><span><input type="checkbox" id="showGhost" checked> Show hardware</span></label>
    <label><span><input type="checkbox" id="showVase" checked> Show vase</span></label>
  </div>
  <table id="stats"></table>
  <div id="groups"></div>
</aside>
<main>
  <canvas id="view"></canvas>
  <div id="busy">Generating…</div>
  <div id="legend"></div>
</main>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js",
  "three-bvh-csg": "/node_modules/three-bvh-csg/build/index.module.js"
} }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
