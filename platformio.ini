[platformio]
default_envs = esp32c6
src_dir = main

[env]
platform = espressif32 @ 6.13.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.extra_component_dirs = components

[env:esp32c6]
board = esp32-c6-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32s3]
board = esp32-s3-devkitc-1

# LOLIN / WEMOS ESP32-S2 Mini (4 MB flash). Moisture ADC is GPIO1.
[env:esp32s2]
board = lolin_s2_mini

[env:esp32dev]
board = esp32dev